[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextshift"
version = "0.1.0"
description = "A framework for context engineering: pluggable strategies for deciding what an LLM sees, summarization as a domain service, and a vendor-neutral LLM provider abstraction."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "ContextShift Contributors" },
]
keywords = ["llm", "context-window", "context-engineering", "prompt-engineering", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.25",
    "PyPDF2>=3.0",
    "Pillow>=9.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["contextshift*"]

[tool.setuptools.package-data]
contextshift = ["py.typed"]
