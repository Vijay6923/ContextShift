[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextshift"
version = "0.1.0"
description = "A framework for context engineering: pluggable strategies for deciding what an LLM sees, summarization as a domain service, and a vendor-neutral LLM provider abstraction."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "ContextShift Contributors" },
]
keywords = ["llm", "context-window", "context-engineering", "prompt-engineering", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.25",
    "PyPDF2>=3.0",
    "Pillow>=9.1",
    "google-genai>=1.0",
    "Flask>=3.0",
    "Flask-Cors>=4.0",
    "Flask-SQLAlchemy>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "types-requests"]
tiktoken = ["tiktoken>=0.5"]
anthropic = ["anthropic>=0.25"]
# Pinned below mkdocs-material's next major -- see its own in-console
# warning about MkDocs 2.0 being a breaking, plugin-incompatible
# rewrite (https://squidfunk.github.io/mkdocs-material/blog/2026/02/18/mkdocs-2.0/).
docs = ["mkdocs-material>=9,<10"]

[tool.setuptools.packages.find]
include = ["contextshift*"]

[tool.setuptools.package-data]
contextshift = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"
# examples/flask-chat/ predates this library and demonstrates usage
# rather than the library's own code -- not held to the same lint
# standard (see CONTRIBUTING.md). tests/fixtures/legacy/ is the
# pre-refactor reference implementation, kept verbatim on purpose so
# characterization tests compare against genuinely untouched legacy
# behavior -- restyling it would defeat that point.
extend-exclude = ["examples/flask-chat", "tests/fixtures/legacy"]

[tool.ruff.lint]
# E/F: pyflakes-equivalent correctness checks (unused imports, undefined
# names) -- the same class of issue pyflakes has always caught locally
# in this project. I: import sorting/formatting.
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["contextshift"]
